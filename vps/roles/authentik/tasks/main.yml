- name: Ensure docker service is running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Create authentik directory
  file:
    path: "{{ authentik_dir }}"
    state: directory

- name: Check if env file exists
  stat:
    path: "{{ authentik_dir }}/.env"
  register: authentik_env

- name: Create env file with generated secrets
  copy:
    dest: "{{ authentik_dir }}/.env"
    content: |
      AUTHENTIK_SECRET_KEY={{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}
      POSTGRES_PASSWORD={{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}
    mode: '0600'
  when: not authentik_env.stat.exists

- name: Copy docker compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_dir }}/docker-compose.yml"

- name: Start authentik
  command: docker compose up -d
  args:
    chdir: "{{ authentik_dir }}"